name: 问题反馈 / Bug report
description: 报告可复现的功能、交互或工程问题 / Report a reproducible problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。安全问题请先阅读 [SECURITY.md](https://github.com/kohlarnhin/pilot-admin/blob/main/SECURITY.md)，只申请私下联系，不要公开漏洞细节、PoC、日志或密钥。
        Search existing issues first. For security concerns, follow [SECURITY.md](https://github.com/kohlarnhin/pilot-admin/blob/main/SECURITY.md): request private contact only; do not publish vulnerability details, PoCs, logs or secrets.
  - type: input
    id: version
    attributes:
      label: 版本或提交 / Version or commit
      description: 填写版本或 commit，并说明二次开发改动。 / Include the version or commit and any fork changes.
      placeholder: main / commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 写明页面、角色、操作顺序；可提供最小复现。 / Include the page, role, steps and a minimal reproduction if possible.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果 / Expected and actual behavior
      description: 可附截图、控制台错误或脱敏日志。 / Attach screenshots, console errors or sanitized logs if useful.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境 / Environment
      description: 系统、浏览器、视口、Node/pnpm 版本和 dev/preview 模式。 / OS, browser, viewport, Node/pnpm versions and dev/preview mode.
    validations:
      required: true
