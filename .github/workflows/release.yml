name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Check release version
        run: >-
          node --input-type=module -e 'import { readFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          if (process.env.RELEASE_TAG !== "v" + version) throw new Error("Expected release tag v" + version);'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm i18n:check
      - run: pnpm typecheck
      # M8b: run pnpm test here before the production build.
      - run: pnpm build
        env:
          VITE_BASE_PATH: /
      - name: Extract release notes
        run: node scripts/release-notes.mjs "${RELEASE_TAG#v}" > release-notes.md
      - name: Package static site
        working-directory: dist
        run: zip -r "../pilot-admin-${RELEASE_TAG}-dist.zip" .
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$RELEASE_TAG" "pilot-admin-${RELEASE_TAG}-dist.zip"
          --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
